[project]
name = "looklive-backend"
version = "0.1.0"
description = "LookLive Face Detection API"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "websockets>=12.0",
    "python-multipart>=0.0.6",
    "sqlalchemy>=2.0.25",
    "psycopg2-binary>=2.9.9",
    "torch>=2.0.0",
    "ultralytics>=8.0.0",
    "pillow>=10.2.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.5.3",
    "numpy>=1.26.3",
]

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.4",
    "pytest-asyncio>=0.23.3",
    "ruff>=0.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"