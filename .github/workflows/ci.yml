name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: looklive
        options: >-
          --health-cmd "pg_isready -U postgres -d looklive"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up backend
        run: |
          cd backend
          python -m venv .venv
          source .venv/bin/activate
          pip install -e .
          pip install pytest

      - name: Set DATABASE_URL for tests
        run: |
          echo "DATABASE_URL=postgresql://postgres:postgres@localhost:5432/looklive" >> $GITHUB_ENV

      - name: Run tests
        run: pytest ../tests/ -v

  lint:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install ruff
        run: pip install ruff

      - name: Run linter
        run: ruff check backend/